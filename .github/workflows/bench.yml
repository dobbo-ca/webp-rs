name: bench
on: { workflow_dispatch: {}, push: { branches: [main] } }
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Not a required check. The Go and Rust decodes of the fixtures and encodes of four images run in
  # one container, so the ratio compares the same machine.
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: bench
          load: true
          push: false
          tags: webp-bench:local
          cache-from: type=gha,scope=webp-rs-bench
          cache-to: type=gha,mode=max,scope=webp-rs-bench
      # docker run, not a RUN layer: a BuildKit cache hit would skip the timing.
      # The v4 columns need AVX-512; a hosted runner without it times the default builds only.
      - run: |
          v4=bench-v4; grep -qw avx512bw /proc/cpuinfo || v4=
          { echo '### Decode and encode time, ms per Mpixel (lower is better)'; echo
            docker run --rm -e BENCH_V4="$v4" webp-bench:local sh tests/parity/bench.sh; } | tee -a "$GITHUB_STEP_SUMMARY"
      # The per-kernel timings: scalar, AVX2 and AVX-512 (where the runner has it), the ratio
      # being what decides which AVX-512 kernels stay (docs/safety.md).
      - run: |
          { echo; echo '### Kernel time, ns a call (avx512/avx2 below 1 is a win)'; echo
            docker run --rm webp-bench:local kbench; } | tee -a "$GITHUB_STEP_SUMMARY"
